<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Netball Scorer">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Netball Scorer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;color:#111827}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:620px;margin:auto;min-height:100vh}
header{background:#111827;color:#fff;text-align:center;padding:12px 14px calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}
.header-line{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:14px}
.quarter{font-weight:700}
.status{opacity:.8}
.content{padding:10px}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.setup label{display:block;font-size:14px;font-weight:700;margin:8px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:17px;background:#fff}
button{border:0;border-radius:13px;padding:14px 10px;font-size:17px;font-weight:700;touch-action:manipulation}
.primary{background:#111827;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.full{width:100%}
.timer-card{text-align:center;padding:10px 12px}
.timer{font-size:58px;line-height:1;font-weight:800;letter-spacing:2px;margin:3px 0 10px;font-variant-numeric:tabular-nums}
.timer.warning{font-size:62px}
.timer-controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.team{background:#f8fafc;border-radius:14px;text-align:center;padding:10px 7px}
.team-name{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:76px;line-height:.95;font-weight:800;margin:10px 0 13px;font-variant-numeric:tabular-nums}
.goal{width:100%;font-size:23px;padding:19px 8px;background:#111827;color:#fff}
.goal:active{transform:scale(.97)}
.scorer-choice{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.scorer-choice button{padding:12px 6px;font-size:18px}.gs{background:#dbeafe;color:#1e3a8a}.ga{background:#fef3c7;color:#92400e}
.centre{display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;font-size:16px;font-weight:800;padding:11px;background:#f3f4f6;border-radius:11px}
.centre span{font-weight:900}
.pass-home{background:#eef2ff}
.pass-away{background:#fef3c7}
.centre-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.centre-actions button{font-size:14px;padding:10px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.section-title h3{margin:0;font-size:17px}
.quarters{width:100%;border-collapse:collapse;font-size:15px}
.quarters th,.quarters td{text-align:center;padding:7px 4px;border-bottom:1px solid #eee}
.quarters th:first-child,.quarters td:first-child{text-align:left}
.quarters .current{font-weight:800;background:#f3f4f6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.history{list-style:none;padding:0;margin:0;max-height:220px;overflow:auto}
.history li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
.empty{text-align:center;color:#6b7280;padding:8px}
.hidden{display:none}
.small{font-size:13px;color:#6b7280;margin-top:7px;text-align:center}
.game-over{font-size:18px;text-align:center;font-weight:800;padding:10px;background:#f3f4f6;border-radius:11px}
.position-table{width:100%;border-collapse:collapse;font-size:15px}.position-table th,.position-table td{text-align:center;padding:7px 4px;border-bottom:1px solid #eee}.position-table th:first-child,.position-table td:first-child{text-align:left;font-weight:800}.position-table .total{font-weight:900;background:#f3f4f6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.hidden{display:none}.modal-card{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:360px;text-align:center}.modal-card h2{margin:0 0 5px;font-size:22px}.modal-card p{margin:0 0 15px;color:#6b7280}.scorer-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scorer-buttons button{font-size:22px;padding:20px 10px}.cancel{margin-top:10px;width:100%}
@media(max-width:370px){
.score{font-size:64px}
.timer{font-size:50px}
.goal{font-size:20px;padding:17px 6px}
.team-name{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🏐 Netball Scorer</h1>
<div class="header-line"><div class="quarter" id="quarterDisplay">Quarter 1 of 4</div><div class="status" id="status">Ready</div></div>
</header>
<div class="content">
<div class="card setup" id="setupCard">
<label>Home Team</label>
<input id="homeName" value="Home" autocomplete="off">
<label>Away Team</label>
<input id="awayName" value="Away" autocomplete="off">
<label>Quarter Length</label>
<select id="quarterLength">
<option value="10">10 minutes</option>
<option value="12">12 minutes</option>
<option value="15" selected>15 minutes</option>
<option value="20">20 minutes</option>
</select>
<label>First Centre Pass</label>
<select id="firstCentre">
<option value="home">Home</option>
<option value="away">Away</option>
</select>
<button class="primary full" onclick="startNewGame()">Start Game</button>
</div>

<div id="gameArea" class="hidden">
<div class="card timer-card">
<div class="timer" id="timer">15:00</div>
<div class="timer-controls">
<button class="primary" id="timerButton" onclick="toggleTimer()">Start</button>
<button class="secondary" onclick="addTime(-60)">-1 min</button>
<button class="secondary" onclick="addTime(60)">+1 min</button>
</div>
</div>

<div class="card scoreboard">
<div class="team">
<div class="team-name" id="homeTeam">Home</div>
<div class="score" id="homeScore">0</div>
<button class="goal" onclick="addGoal('home')">+1 GOAL</button>
<div class="scorer-choice"><button class="gs" onclick="addGoal('home','GS')">GS</button><button class="ga" onclick="addGoal('home','GA')">GA</button></div>
</div>
<div class="team">
<div class="team-name" id="awayTeam">Away</div>
<div class="score" id="awayScore">0</div>
<button class="goal" onclick="addGoal('away')">+1 GOAL</button>
<div class="scorer-choice"><button class="gs" onclick="addGoal('away','GS')">GS</button><button class="ga" onclick="addGoal('away','GA')">GA</button></div>
</div>
</div>

<div class="card">
<div class="centre" id="centreDisplay">Centre pass: Home</div>
<div class="centre-actions">
<button class="secondary" onclick="setCentre('home')">Centre → Home</button>
<button class="secondary" onclick="setCentre('away')">Centre → Away</button>
</div>
<div class="small">Centre pass automatically changes after every goal.</div>
</div>

<div class="card">
<div class="section-title"><h3>Quarter Scores</h3><span id="runningScore">0 – 0</span></div>
<table class="quarters">
<thead><tr><th>Quarter</th><th id="qh">Home</th><th id="qa">Away</th></tr></thead>
<tbody id="quarterRows"></tbody>
</table>
</div>

<div class="card">
<div class="actions">
<button class="secondary" onclick="undoGoal()">↩ Undo Goal</button>
<button class="danger" onclick="endGame()">End Game</button>
</div>
</div>

<div class="card">
<div class="section-title"><h3>Scoring Totals</h3><span id="goalCount">0 goals</span></div>
<table class="position-table"><thead><tr><th>Scorer</th><th id="ph">Home</th><th id="pa">Away</th></tr></thead><tbody id="positionRows"></tbody></table>
</div>

<div class="card">
<div class="section-title"><h3>Recent Goals</h3></div>
<ul class="history" id="history"><li class="empty">No goals yet</li></ul>
</div>

<div class="card">
<button class="primary full" id="quarterButton" onclick="nextQuarter()">Finish Quarter 1</button>
</div>

<div class="card">
<button class="secondary full" onclick="newGame()">New Game</button>
</div>
</div>
</div>

<div class="modal hidden" id="scorerModal">
<div class="modal-card">
<h2 id="scorerTitle">Who scored?</h2>
<p>Tap the goal scorer</p>
<div class="scorer-buttons"><button class="primary" onclick="confirmScorer('GS')">GS</button><button class="primary" onclick="confirmScorer('GA')">GA</button></div>
<button class="secondary cancel" onclick="cancelScorer()">Cancel</button>
</div>
</div>
</div>

<script>
(function(){
"use strict";
var game={homeName:"Home",awayName:"Away",homeScore:0,awayScore:0,quarter:1,quarterLength:15,seconds:900,centre:"home",history:[],quarterScores:[[0,0],[0,0],[0,0],[0,0]],positions:{home:{GS:0,GA:0,WA:0,C:0,WD:0,GD:0,GK:0},away:{GS:0,GA:0,WA:0,C:0,WD:0,GD:0,GK:0}},finished:false,running:false};
var timer=null;
function $(id){return document.getElementById(id);}
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}
function save(){try{localStorage.setItem("netballScorerGame",JSON.stringify(game));}catch(e){}}
function render(){
 $("homeScore").textContent=game.homeScore;$("awayScore").textContent=game.awayScore;
 $("timer").textContent=fmt(game.seconds);$("timerButton").textContent=game.running?"Pause":"Start";
 $("status").textContent=game.finished?"Final":game.running?"LIVE":"Paused";
 $("quarterDisplay").textContent=game.finished?"GAME COMPLETE":"Quarter "+game.quarter+" of 4";
 $("homeTeam").textContent=game.homeName;$("awayTeam").textContent=game.awayName;
 $("qh").textContent=game.homeName;$("qa").textContent=game.awayName;
 $("runningScore").textContent=game.homeScore+" – "+game.awayScore;
 $("centreDisplay").textContent="Centre pass: "+(game.centre==="home"?game.homeName:game.awayName);
 $("goalCount").textContent=game.history.length+" goals";
 $("ph").textContent=game.homeName;$("pa").textContent=game.awayName;
 var pos=["GS","GA","WA","C","WD","GD","GK"],pr="";for(var p=0;p<pos.length;p++)pr+="<tr><td>"+pos[p]+"</td><td>"+game.positions.home[pos[p]]+"</td><td>"+game.positions.away[pos[p]]+"</td></tr>";pr+="<tr class=\"total\"><td>Total goals</td><td>"+game.homeScore+"</td><td>"+game.awayScore+"</td></tr>";$("positionRows").innerHTML=pr;
 var rows="";for(var i=0;i<4;i++)rows+="<tr"+(i+1===game.quarter&&!game.finished?" class=\"current\"":"")+"><td>Q"+(i+1)+"</td><td>"+game.quarterScores[i][0]+"</td><td>"+game.quarterScores[i][1]+"</td></tr>";
 $("quarterRows").innerHTML=rows;
 var h="";for(var j=Math.max(0,game.history.length-25);j<game.history.length;j++){var q=game.history[j];h="<li><span>"+q.team+" · <b>"+(q.scorer||"?")+"</b></span><span>Q"+q.quarter+" · "+fmt(q.time)+"</span></li>"+h;}
 $("history").innerHTML=h||'<li class="empty">No goals yet</li>';
 $("quarterButton").textContent=game.quarter>=4?"Finish Game":"Finish Quarter "+game.quarter;
 save();
}
window.startNewGame=function(){
 clearInterval(timer);game={homeName:$("homeName").value.trim()||"Home",awayName:$("awayName").value.trim()||"Away",quarter:1,quarterLength:Number($("quarterLength").value)||15,seconds:(Number($("quarterLength").value)||15)*60,homeScore:0,awayScore:0,centre:$("firstCentre").value,history:[],quarterScores:[[0,0],[0,0],[0,0],[0,0]],finished:false,running:false};
 $("setupCard").classList.add("hidden");$("gameArea").classList.remove("hidden");render();
};
var pendingSide=null;
window.addGoal=function(side,scorer){if(game.finished)return;if(!scorer){pendingSide=side;$("scorerTitle").textContent=(side==="home"?game.homeName:game.awayName)+" — who scored?";$("scorerModal").classList.remove("hidden");return;}if(side==="home"){game.homeScore++;game.quarterScores[game.quarter-1][0]++;}else{game.awayScore++;game.quarterScores[game.quarter-1][1]++;}if(game.positions&&game.positions[side]&&game.positions[side][scorer]!==undefined)game.positions[side][scorer]++;game.history.push({team:side==="home"?game.homeName:game.awayName,side:side,scorer:scorer,quarter:game.quarter,time:game.seconds});game.centre=side==="home"?"away":"home";if(navigator.vibrate)navigator.vibrate(25);render();};
window.cancelScorer=function(){pendingSide=null;$("scorerModal").classList.add("hidden");};
window.confirmScorer=function(scorer){if(!pendingSide||game.finished)return;var side=pendingSide;pendingSide=null;$("scorerModal").classList.add("hidden");window.addGoal(side,scorer);};
window.undoGoal=function(){if(!game.history.length||game.finished)return;var q=game.history.pop();if(q.scorer&&game.positions&&game.positions[q.side]&&game.positions[q.side][q.scorer]!==undefined)game.positions[q.side][q.scorer]--;if(q.side==="home"){game.homeScore--;game.quarterScores[q.quarter-1][0]--;}else{game.awayScore--;game.quarterScores[q.quarter-1][1]--;}game.centre=q.side;render();};
window.toggleTimer=function(){if(game.finished)return;if(game.running){clearInterval(timer);game.running=false;render();}else{game.running=true;render();timer=setInterval(function(){if(game.seconds>0)game.seconds--;if(game.seconds<=0){clearInterval(timer);game.running=false;alert("Time is up for Quarter "+game.quarter+"!");}render();},1000);}};
window.addTime=function(n){if(!game.finished){game.seconds=Math.max(0,game.seconds+n);render();}};
window.setCentre=function(s){if(!game.finished){game.centre=s;render();}};
window.nextQuarter=function(){clearInterval(timer);game.running=false;if(game.quarter>=4){game.finished=true;render();alert("Final Score\n\n"+game.homeName+" "+game.homeScore+" – "+game.awayScore+" "+game.awayName);}else{game.quarter++;game.seconds=game.quarterLength*60;render();}};
window.finishGame=function(){clearInterval(timer);game.running=false;game.finished=true;render();alert("Final Score\n\n"+game.homeName+" "+game.homeScore+" – "+game.awayScore+" "+game.awayName);};
window.endGame=function(){if(confirm("End the game now?")){game.finished=true;clearInterval(timer);game.running=false;render();}};
window.newGame=function(){if(confirm("Start a new game? The current score will be cleared.")){localStorage.removeItem("netballScorerGame");location.reload();}};
window.addEventListener("load",function(){var s=localStorage.getItem("netballScorerGame");if(s){try{game=JSON.parse(s);$("setupCard").classList.add("hidden");$("gameArea").classList.remove("hidden");}catch(e){localStorage.removeItem("netballScorerGame");}}render();});
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Netball Scorer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;-webkit-tap-highlight-color:transparent}
.app{max-width:720px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 12px}h1{font-size:24px;margin:0}.small{font-size:13px;color:#6b7280}
.card{background:white;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0000000d}
.setup label{display:block;font-size:13px;color:#6b7280;margin:8px 0 5px}.setup input{width:100%;font-size:17px;padding:12px;border:1px solid #d1d5db;border-radius:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;font-size:15px;background:#e5e7eb;color:#111827;font-weight:600}.btn.primary{background:#111827;color:white}.btn.danger{background:#fee2e2;color:#991b1b}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{text-align:center}.team-name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:76px;line-height:1.05;font-weight:800;margin:8px 0}.goal{width:100%;font-size:25px;padding:17px;border:0;border-radius:16px;background:#111827;color:white;font-weight:800}.goal:active{transform:scale(.98)}
.timer{text-align:center}.period{font-size:14px;font-weight:700;color:#6b7280}.time{font-variant-numeric:tabular-nums;font-size:52px;font-weight:800;margin:2px 0 10px}.timer .btn{min-width:100px}
.history{max-height:190px;overflow:auto}.event{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}.event:last-child{border:0}
.footer{text-align:center;color:#9ca3af;font-size:12px;padding:15px}.hidden{display:none!important}
@media(max-width:430px){.score{font-size:64px}.time{font-size:46px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Netball Scorer</h1><div class="small">Simple match scorer</div></div><button class="btn" id="resetBtn">New Game</button></header>

<div class="card setup" id="setup">
<label>Home team</label><input id="homeName" value="Home">
<label>Away team</label><input id="awayName" value="Away">
<label>Quarter length (minutes)</label><input id="minutes" type="number" min="1" max="60" value="15">
<div class="controls" style="margin-top:12px"><button class="btn primary" id="startBtn">Start Game</button></div>
</div>

<div id="game" class="hidden">
<div class="card scoreboard">
<div class="team"><div class="team-name" id="homeLabel">Home</div><div class="score" id="homeScore">0</div><button class="goal" id="homeGoal">+1 Goal</button></div>
<div class="team"><div class="team-name" id="awayLabel">Away</div><div class="score" id="awayScore">0</div><button class="goal" id="awayGoal">+1 Goal</button></div>
</div>

<div class="card timer">
<div class="period" id="period">Quarter 1 of 4</div>
<div class="time" id="time">15:00</div>
<div class="controls" style="justify-content:center">
<button class="btn primary" id="timerBtn">Start</button>
<button class="btn" id="nextBtn">Next Quarter</button>
</div>
</div>

<div class="card">
<div class="controls">
<button class="btn" id="undoBtn">Undo Last Goal</button>
<button class="btn danger" id="endBtn">End Game</button>
</div>
</div>

<div class="card">
<strong>Goal history</strong>
<div class="history" id="history"><div class="small" style="padding-top:10px">No goals recorded yet.</div></div>
</div>
</div>
<div class="footer">Scores are saved on this device.</div>
</div>
<script>
const $=id=>document.getElementById(id);
let state={home:0,away:0,homeName:"Home",awayName:"Away",quarter:1,seconds:900,running:false,events:[],minutes:15};
let interval=null;
function save(){localStorage.setItem("netballScorer",JSON.stringify(state))}
function load(){try{const s=JSON.parse(localStorage.getItem("netballScorer"));if(s&&s.homeName){state={...state,...s};return true}}catch(e){}return false}
function fmt(n){return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function render(){
$("homeLabel").textContent=state.homeName;$("awayLabel").textContent=state.awayName;
$("homeScore").textContent=state.home;$("awayScore").textContent=state.away;
$("period").textContent="Quarter "+state.quarter+" of 4";$("time").textContent=fmt(state.seconds);
$("timerBtn").textContent=state.running?"Pause":"Start";
$("nextBtn").textContent=state.quarter<4?"Next Quarter":"Finish Game";
$("history").innerHTML=state.events.length?state.events.slice().reverse().map(e=>'<div class="event"><span>'+e.team+' goal</span><strong>'+e.score+'</strong></div>').join(""):'<div class="small" style="padding-top:10px">No goals recorded yet.</div>';
save()
}
function goal(team){
state[team]++;state.events.push({team:team==="home"?state.homeName:state.awayName,score:state.home+" - "+state.away});render()
}
function stop(){clearInterval(interval);state.running=false}
function tick(){if(state.seconds>0){state.seconds--;render()}else{stop();navigator.vibrate?.([100,80,100]);alert("Quarter "+state.quarter+" is finished.")}}
$("startBtn").onclick=()=>{state.homeName=$("homeName").value.trim()||"Home";state.awayName=$("awayName").value.trim()||"Away";state.minutes=Math.max(1,Math.min(60,+$("minutes").value||15));state.seconds=state.minutes*60;state.home=0;state.away=0;state.quarter=1;state.events=[];$("setup").classList.add("hidden");$("game").classList.remove("hidden");render()}
$("homeGoal").onclick=()=>goal("home");$("awayGoal").onclick=()=>goal("away");
$("undoBtn").onclick=()=>{const e=state.events.pop();if(!e)return;const team=e.team===state.homeName?"home":"away";state[team]--;render()}
$("timerBtn").onclick=()=>{if(state.running){stop();render()}else{state.running=true;interval=setInterval(tick,1000);render()}}
$("nextBtn").onclick=()=>{if(state.quarter>=4){stop();alert("Final score: "+state.homeName+" "+state.home+" - "+state.away+" "+state.awayName);return}stop();state.quarter++;state.seconds=state.minutes*60;render()}
$("endBtn").onclick=()=>{stop();alert("Final score: "+state.homeName+" "+state.home+" - "+state.away+" "+state.awayName)}
$("resetBtn").onclick=()=>{stop();localStorage.removeItem("netballScorer");$("game").classList.add("hidden");$("setup").classList.remove("hidden");}
if(load()){$("setup").classList.add("hidden");$("game").classList.remove("hidden");render()}
</script>
</body>
</html>

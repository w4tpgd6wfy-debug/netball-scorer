<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Netball Scorer">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Netball Scorer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;color:#111827}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:620px;margin:auto;min-height:100vh}
header{background:#111827;color:#fff;text-align:center;padding:12px 14px calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}
.header-line{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:14px}
.quarter{font-weight:700}
.status{opacity:.8}
.content{padding:10px}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.setup label{display:block;font-size:14px;font-weight:700;margin:8px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:17px;background:#fff}
button{border:0;border-radius:13px;padding:14px 10px;font-size:17px;font-weight:700;touch-action:manipulation}
.primary{background:#111827;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.full{width:100%}
.timer-card{text-align:center;padding:10px 12px}
.timer{font-size:58px;line-height:1;font-weight:800;letter-spacing:2px;margin:3px 0 10px;font-variant-numeric:tabular-nums}
.timer.warning{font-size:62px}
.timer-controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.team{background:#f8fafc;border-radius:14px;text-align:center;padding:10px 7px}
.team-name{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:76px;line-height:.95;font-weight:800;margin:10px 0 13px;font-variant-numeric:tabular-nums}
.goal{width:100%;font-size:23px;padding:19px 8px;background:#111827;color:#fff}
.goal:active{transform:scale(.97)}
.centre{display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;font-size:16px;font-weight:800;padding:11px;background:#f3f4f6;border-radius:11px}
.centre span{font-weight:900}
.pass-home{background:#eef2ff}
.pass-away{background:#fef3c7}
.centre-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.centre-actions button{font-size:14px;padding:10px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.section-title h3{margin:0;font-size:17px}
.quarters{width:100%;border-collapse:collapse;font-size:15px}
.quarters th,.quarters td{text-align:center;padding:7px 4px;border-bottom:1px solid #eee}
.quarters th:first-child,.quarters td:first-child{text-align:left}
.quarters .current{font-weight:800;background:#f3f4f6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.history{list-style:none;padding:0;margin:0;max-height:220px;overflow:auto}
.history li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
.empty{text-align:center;color:#6b7280;padding:8px}
.hidden{display:none}
.small{font-size:13px;color:#6b7280;margin-top:7px;text-align:center}
.game-over{font-size:18px;text-align:center;font-weight:800;padding:10px;background:#f3f4f6;border-radius:11px}
@media(max-width:370px){
.score{font-size:64px}
.timer{font-size:50px}
.goal{font-size:20px;padding:17px 6px}
.team-name{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🏐 Netball Scorer</h1>
<div class="header-line"><div class="quarter" id="quarterDisplay">Quarter 1 of 4</div><div class="status" id="status">Ready</div></div>
</header>
<div class="content">
<div class="card setup" id="setupCard">
<label>Home Team</label>
<input id="homeName" value="Home" autocomplete="off">
<label>Away Team</label>
<input id="awayName" value="Away" autocomplete="off">
<label>Quarter Length</label>
<select id="quarterLength">
<option value="10">10 minutes</option>
<option value="12">12 minutes</option>
<option value="15" selected>15 minutes</option>
<option value="20">20 minutes</option>
</select>
<label>First Centre Pass</label>
<select id="firstCentre">
<option value="home">Home</option>
<option value="away">Away</option>
</select>
<button class="primary full" onclick="startNewGame()">Start Game</button>
</div>

<div id="gameArea" class="hidden">
<div class="card timer-card">
<div class="timer" id="timer">15:00</div>
<div class="timer-controls">
<button class="primary" id="timerButton" onclick="toggleTimer()">Start</button>
<button class="secondary" onclick="addTime(-60)">-1 min</button>
<button class="secondary" onclick="addTime(60)">+1 min</button>
</div>
</div>

<div class="card scoreboard">
<div class="team">
<div class="team-name" id="homeTeam">Home</div>
<div class="score" id="homeScore">0</div>
<button class="goal" onclick="addGoal('home')">+1 GOAL</button>
</div>
<div class="team">
<div class="team-name" id="awayTeam">Away</div>
<div class="score" id="awayScore">0</div>
<button class="goal" onclick="addGoal('away')">+1 GOAL</button>
</div>
</div>

<div class="card">
<div class="centre" id="centreDisplay">Centre pass: Home</div>
<div class="centre-actions">
<button class="secondary" onclick="setCentre('home')">Centre → Home</button>
<button class="secondary" onclick="setCentre('away')">Centre → Away</button>
</div>
<div class="small">Centre pass automatically changes after every goal.</div>
</div>

<div class="card">
<div class="section-title"><h3>Quarter Scores</h3><span id="runningScore">0 – 0</span></div>
<table class="quarters">
<thead><tr><th>Quarter</th><th id="qh">Home</th><th id="qa">Away</th></tr></thead>
<tbody id="quarterRows"></tbody>
</table>
</div>

<div class="card">
<div class="actions">
<button class="secondary" onclick="undoGoal()">↩ Undo Goal</button>
<button class="danger" onclick="endGame()">End Game</button>
</div>
</div>

<div class="card">
<div class="section-title"><h3>Recent Goals</h3><span id="goalCount">0</span></div>
<ul class="history" id="history"><li class="empty">No goals yet</li></ul>
</div>

<div class="card">
<button class="primary full" id="quarterButton" onclick="nextQuarter()">Finish Quarter 1</button>
</div>

<div class="card">
<button class="secondary full" onclick="newGame()">New Game</button>
</div>
</div>
</div>
</div>

<script>
let game={
homeName:"Home",awayName:"Away",homeScore:0,awayScore:0,quarter:1,quarterLength:15,seconds:900,running:false,centre:"home",history:[],quarterScores:[[0,0],[0,0],[0,0],[0,0]],finished:false
};
let timerInterval=null;

function saveGame(){localStorage.setItem("netballScorerGame",JSON.stringify(game))}
function vibrate(){if(navigator.vibrate)navigator.vibrate(20)}
function formatTime(s){let m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")}
function escapeHtml(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}

function startNewGame(){
pauseTimer(false);
game.homeName=document.getElementById("homeName").value.trim()||"Home";
game.awayName=document.getElementById("awayName").value.trim()||"Away";
game.quarterLength=Number(document.getElementById("quarterLength").value);
game.homeScore=0;game.awayScore=0;game.quarter=1;game.seconds=game.quarterLength*60;game.running=false;
game.centre=document.getElementById("firstCentre").value;game.history=[];game.quarterScores=[[0,0],[0,0],[0,0],[0,0]];game.finished=false;
saveGame();showGame();
}

function showGame(){
document.getElementById("setupCard").classList.add("hidden");
document.getElementById("gameArea").classList.remove("hidden");
document.getElementById("homeTeam").textContent=game.homeName;
document.getElementById("awayTeam").textContent=game.awayName;
render();
}

function render(){
document.getElementById("homeScore").textContent=game.homeScore;
document.getElementById("awayScore").textContent=game.awayScore;
document.getElementById("quarterDisplay").textContent=game.finished?"GAME COMPLETE":"Quarter "+game.quarter+" of 4";
document.getElementById("status").textContent=game.finished?"Final":(game.running?"LIVE":"Paused");
document.getElementById("timer").textContent=formatTime(game.seconds);
document.getElementById("timer").classList.toggle("warning",game.seconds<=60);
document.getElementById("timerButton").textContent=game.running?"Pause":"Start";
document.getElementById("runningScore").textContent=game.homeScore+" – "+game.awayScore;
document.getElementById("qh").textContent=game.homeName;
document.getElementById("qa").textContent=game.awayName;
document.getElementById("centreDisplay").innerHTML="Centre pass: <span>"+escapeHtml(game.centre==="home"?game.homeName:game.awayName)+"</span>";
document.getElementById("centreDisplay").className="centre "+(game.centre==="home"?"pass-home":"pass-away");
document.getElementById("goalCount").textContent=game.history.length;
document.getElementById("quarterButton").textContent=game.quarter>=4?"Finish Game":"Finish Quarter "+game.quarter;
renderQuarterRows();
renderHistory();
saveGame();
}

function renderQuarterRows(){
let html="";
for(let i=0;i<4;i++){
let cls=i+1===game.quarter&&!game.finished?" class="current"":"";
html+="<tr"+cls+"><td>Q"+(i+1)+"</td><td>"+game.quarterScores[i][0]+"</td><td>"+game.quarterScores[i][1]+"</td></tr>";
}
document.getElementById("quarterRows").innerHTML=html;
}

function renderHistory(){
const el=document.getElementById("history");
if(!game.history.length){el.innerHTML='<li class="empty">No goals yet</li>';return}
el.innerHTML=game.history.slice(-25).reverse().map((x,i)=>"<li><span>"+escapeHtml(x.team)+"</span><span>Q"+x.quarter+" · "+formatTime(x.time)+"</span></li>").join("");
}

function addGoal(side){
if(game.finished)return;
if(side==="home"){game.homeScore++;game.quarterScores[game.quarter-1][0]++}else{game.awayScore++;game.quarterScores[game.quarter-1][1]++}
game.history.push({team:side==="home"?game.homeName:game.awayName,side:side,quarter:game.quarter,time:game.seconds});
game.centre=side==="home"?"away":"home";
vibrate();render();
}

function undoGoal(){
if(!game.history.length||game.finished)return;
const x=game.history.pop();
if(x.side==="home"){game.homeScore=Math.max(0,game.homeScore-1);game.quarterScores[x.quarter-1][0]=Math.max(0,game.quarterScores[x.quarter-1][0]-1)}
else{game.awayScore=Math.max(0,game.awayScore-1);game.quarterScores[x.quarter-1][1]=Math.max(0,game.quarterScores[x.quarter-1][1])}
game.centre=x.side;
vibrate();render();
}

function toggleTimer(){game.running?pauseTimer(true):startTimer()}
function startTimer(){
if(game.finished||game.seconds<=0)return;
game.running=true;clearInterval(timerInterval);
timerInterval=setInterval(()=>{
if(game.seconds>0)game.seconds--;
if(game.seconds<=0){pauseTimer(true);timerEnded()}
render();
},1000);
render();
}
function pauseTimer(update=true){
game.running=false;clearInterval(timerInterval);timerInterval=null;if(update)render();
}
function timerEnded(){vibrate();setTimeout(()=>alert("Time is up for Quarter "+game.quarter+"!"),50)}
function addTime(amount){
if(game.finished)return;
game.seconds=Math.max(0,game.seconds+amount);
render();
}

function setCentre(side){if(game.finished)return;game.centre=side;vibrate();render()}

function nextQuarter(){
pauseTimer(false);
if(game.quarter>=4){finishGame();return}
game.quarter++;game.seconds=game.quarterLength*60;render();
}

function finishGame(){
pauseTimer(false);game.finished=true;render();
setTimeout(()=>alert("Final Score\n\n"+game.homeName+" "+game.homeScore+" – "+game.awayScore+" "+game.awayName),50);
}

function endGame(){
pauseTimer(false);
if(confirm("End the game now?")){game.finished=true;render();setTimeout(()=>alert("Final Score\n\n"+game.homeName+" "+game.homeScore+" – "+game.awayScore+" "+game.awayName),50)}
else{game.running=false;render()}
}

function newGame(){
pauseTimer(false);
if(confirm("Start a new game? The current score will be cleared.")){
localStorage.removeItem("netballScorerGame");
game={homeName:"Home",awayName:"Away",homeScore:0,awayScore:0,quarter:1,quarterLength:15,seconds:900,running:false,centre:"home",history:[],quarterScores:[[0,0],[0,0],[0,0],[0,0]],finished:false};
document.getElementById("gameArea").classList.add("hidden");document.getElementById("setupCard").classList.remove("hidden");
}
}

function loadGame(){
const saved=localStorage.getItem("netballScorerGame");
if(saved){try{game=JSON.parse(saved);if(game.running)game.running=false;showGame()}catch(e){localStorage.removeItem("netballScorerGame")}}
}
window.addEventListener("load",loadGame);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script>
</body>
</html>
